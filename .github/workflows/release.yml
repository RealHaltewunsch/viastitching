name: Build KiCad PCM release

on:
  push:
    tags:
      - "Release-*.*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Test, package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Validate tag and metadata version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^Release-([0-9]+\.){3}[0-9]+$ ]]; then
            echo "Expected Release-x.x.x.x tag" >&2
            exit 1
          fi
          release_version="${GITHUB_REF_NAME#Release-}"
          version="${release_version%.*}"
          epoch="${release_version##*.}"
          test "${version}" = "$(jq -r '.versions[0].version' metadata.json)"
          test "${epoch}" = "$(jq -r '.versions[0].version_epoch // 0' metadata.json)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=viastitcher-${version}-geometric-pcm.zip" >> "${GITHUB_OUTPUT}"

      - name: Run portable geometry tests
        run: python -m unittest discover -s tests -v
      - name: Compile existing Python sources
        run: python -m compileall -q -f .
      - name: Build and verify committed PCM package
        run: python build_pcm.py "${RUNNER_TEMP}/release-package"

      - name: Prepare release assets and repository metadata
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/release-package/${ARCHIVE}" .
          cp "${RUNNER_TEMP}/release-package/${ARCHIVE}.sha256" .
          cp "${RUNNER_TEMP}/release-package/source.json" source.json
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          archive=Path(os.environ['ARCHIVE'])
          metadata=json.loads(Path('metadata.json').read_text())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              install_size=sum(i.file_size for i in z.infolist())
          version=metadata['versions'][0]
          version.update(download_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+os.environ['GITHUB_REF_NAME']+'/'+archive.name,
                         download_sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),
                         download_size=archive.stat().st_size,install_size=install_size)
          Path('repository-metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viastitcher-${{ steps.version.outputs.version }}-pcm
          path: |
            ${{ steps.version.outputs.archive }}
            ${{ steps.version.outputs.archive }}.sha256
            repository-metadata.json
            source.json
          if-no-files-found: error

      - name: Publish experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "${ARCHIVE}#Installable KiCad PCM package" \
            "${ARCHIVE}.sha256#SHA256 checksum" \
            "repository-metadata.json#PCM download metadata" \
            "source.json#Source revision and package checksum" \
            --verify-tag --prerelease --latest=false \
            --title "ViaStitcher ${{ steps.version.outputs.version }} – geometric engine preview" \
            --generate-notes
