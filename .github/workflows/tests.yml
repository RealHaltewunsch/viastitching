name: Geometry tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run portable geometry tests
        run: python -m unittest discover -s tests -v
      - name: Compile existing Python sources
        run: python -m compileall -q -f .
      - name: Verify committed PCM package
        run: python build_pcm.py "${RUNNER_TEMP}/pcm-test"
